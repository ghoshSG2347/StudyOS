<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="120" y1="120" x2="392" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="shelfGrad1" x1="130" y1="270" x2="382" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shelfGrad2" x1="150" y1="340" x2="362" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <!-- Base Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Graduation Cap Main Diamond -->
  <path d="M256 120 L410 184 L256 248 L102 184 Z" fill="url(#capGrad)" stroke="#C7D2FE" stroke-width="4" stroke-linejoin="round"/>
  <!-- Cap Skull Base -->
  <path d="M168 214 V242 C168 274 344 274 344 242 V214" fill="#4338CA" stroke="#818CF8" stroke-width="4"/>
  <!-- Golden Tassel -->
  <path d="M410 184 L418 274" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
  <circle cx="418" cy="282" r="9" fill="#FBBF24"/>
  
  <!-- Curriculum Shelf Tier 1 -->
  <path d="M124 280 L256 322 L388 280" stroke="url(#shelfGrad1)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Curriculum Shelf Tier 2 -->
  <path d="M148 348 L256 384 L364 348" stroke="url(#shelfGrad2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>